# A realistic project with problems that only show up on some machines.
services:
  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    deploy:
      replicas: 2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      API_URL: ${API_URL}
    develop:
      watch:
        - path: ./web
          action: rebuild

  api:
    image: node:20-alpine
    ports:
      - "8080:3000"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

  cache:
    image: redis:7.9.99-alpine
