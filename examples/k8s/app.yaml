# Deliberately broken manifests for trying `container-preflight k8s`.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: gcr.io/google-containers/pause-amd64:3.2   # amd64 only
        resources: {requests: {cpu: 100m, memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: huge}
spec:
  selector: {matchLabels: {app: huge}}
  template:
    metadata: {labels: {app: huge}}
    spec:
      containers:
      - name: huge
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources: {requests: {memory: 64Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: typo}
spec:
  containers: [{name: x, image: nginx:9.99.99}]
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata: {name: old-ingress}
spec: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db}
spec:
  serviceName: db
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers: [{name: db, image: busybox:1.36, command: ["sleep", "3600"]}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      storageClassName: gp3
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
